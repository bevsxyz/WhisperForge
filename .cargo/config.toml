# Build accelerators (sccache wrapper, mold linker) are intentionally NOT committed
# here. A committed `rustc-wrapper`/linker would apply to every cargo invocation —
# including dist's release runners (no sccache/mold installed) and fresh clones —
# and would also pin the linux release build's glibc. Instead they're provisioned
# per-environment, where the tools are guaranteed present:
#   - CI: .github/workflows/ci.yml sets RUSTC_WRAPPER=sccache and the mold linker
#   - local dev: mise.toml `[env]` sets RUSTC_WRAPPER=sccache (sccache via `[tools]`)
# Release builds (dist) deliberately use the stock toolchain on ubuntu-22.04 for
# broad glibc compatibility.

# ORT pre-built static library (ort 2.0.0-rc.10, download-binaries) references
# old-MSVCRT symbols (__dstbias, __timezone, __tzname) that live only in
# legacy_stdio_definitions.lib — Microsoft's backward-compat shim for pre-VS2015
# CRT references, absent from ucrt.lib/msvcrt.lib/vcruntime.lib.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=legacy_stdio_definitions.lib"]
