[package]
name = "whisperforge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Fast GPU-accelerated speech-to-text CLI with streaming, quantization, speaker diarization, and multilingual support. Includes model conversion from HuggingFace safetensors."
keywords = ["whisper", "speech-to-text", "transcription", "gpu", "wgpu"]
categories = ["command-line-utilities", "multimedia::audio"]
readme = "README.md"
autobins = false
autobenches = false
default-run = "wforge"

[package.metadata.wix]
upgrade-guid = "D47087C4-7AF7-4DC5-8847-30F2E3E20968"
path-guid = "6DD099AE-AAC4-45F0-B664-2E6A99A67551"
license = false
eula = false

[[bin]]
name = "wforge"
path = "src/main.rs"

# Dev-only profiling tool. Declared as an example (not a [[bin]]) so dist never
# ships it in release archives. Run with: cargo run --release --example stream_bench
[[example]]
name = "stream_bench"
path = "benches/stream_latency.rs"

[dependencies]
whisperforge-core = { path = "../whisperforge-core", version = "0.5" }
whisperforge-align = { path = "../whisperforge-align", version = "0.5" }
whisperforge-diarize = { path = "../whisperforge-diarize", version = "0.5" }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = "4.4"
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokenizers = { workspace = true }
cpal = { workspace = true }
ringbuf = { workspace = true }
# Platform-standard cache/data dirs for the default models location.
directories = "6"
# Interactive model picker (TTY fallback when no model is given).
dialoguer = { version = "0.11", default-features = false }
ort = { workspace = true }
crossterm = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# `train` feature is required for Module::quantize_weights (used by `wforge convert --quantize int8`).
burn = { workspace = true, features = ["std", "train", "burn-flex"] }
burn-flex = { workspace = true }
burn-wgpu = { version = "0.21.0", optional = true }
burn-cuda = { version = "0.21.0", optional = true }
# Model conversion (`wforge convert`) deps.
safetensors = "0.7"
hf-hub = { version = "0.5", default-features = false, features = ["tokio"] }
tokio = { version = "1.36.0", features = ["rt-multi-thread", "rt", "signal", "macros"] }
half = "2.3.1"
hound = "3.5"

[target.'cfg(target_os = "macos")'.dependencies]
burn = { workspace = true, features = ["metal"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
burn = { workspace = true, features = ["vulkan"] }

[features]
cubecl-stft = ["dep:burn-wgpu", "whisperforge-core/cubecl-stft"]
gpu = ["burn/wgpu"]
cuda = ["dep:burn-cuda"]
default = []
