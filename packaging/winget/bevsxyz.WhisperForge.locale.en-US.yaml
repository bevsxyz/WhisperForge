ShortDescription: "Fast GPU-accelerated speech-to-text CLI with streaming, quantization, speaker diarization, and multilingual support."
Description: |
  WhisperForge is a high-performance speech-to-text (ASR) CLI built on OpenAI's Whisper model.
  It offers GPU acceleration via multiple backends (CPU, WGPU, CUDA), real-time streaming transcription,
  INT8 quantization for 4× model size reduction, and multilingual support.

  Key features:
  - Streaming realtime ASR from microphone or file
  - GPU acceleration (WGPU, CUDA) for 8–30× faster inference than CPU
  - INT8 quantization reduces model size from 150 MB to 37 MB
  - Multilingual and English-only models
  - Speaker diarization
  - Multiple output formats (JSON, SRT, WebVTT)
